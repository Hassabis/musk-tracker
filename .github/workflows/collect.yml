name: Collect posts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musk-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Sync the cloud archive
        run: node scripts/collect.mjs
        env:
          MUSK_ORIGIN: https://musk-tracker.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
